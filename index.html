<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#DCE8F2">
<title>Bandung, 20–22 Nov</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/style.css?v=1731">
</head>
<body>
<div class="app">
  <main>
    <section id="tab-rencana" class="tab" role="tabpanel" aria-labelledby="btn-rencana">
      <header class="head">
        <p class="eyebrow">Untuk Wulan</p>
        <h1 id="title">Bandung, 20–22 Nov</h1>
        <p id="greeting" class="greet"></p>
      </header>
      <div class="chips" id="dayChips" role="tablist" aria-label="Pilih hari"></div>
      <ol class="timeline" id="timeline"></ol>
      <section class="pick" aria-labelledby="pickTitle">
        <h2 id="pickTitle">Pilih tempat Minggu 🌸</h2>
        <p class="note" id="pickNote"></p>
        <p class="chosen" id="chosenBar" hidden></p>
        <div id="pickGroups"></div>
      </section>
    </section>

    <section id="tab-peta" class="tab" role="tabpanel" aria-labelledby="btn-peta" hidden>
      <div class="chips map-chips" id="mapChips" aria-label="Filter peta"></div>
      <div id="map" aria-label="Peta"></div>
      <div class="legend" aria-label="Legenda"><span><i class="dot d-jum"></i>Jum</span><span><i class="dot d-sab"></i>Sab</span><span><i class="dot d-min"></i>Min / pilihan</span><span><i class="dot d-min big">✓</i>Pilihan Wulan</span></div>
      <p class="note mapnote" id="mapNote"></p>
    </section>
  </main>

  <nav class="tabbar" aria-label="Menu utama">
    <button id="btn-rencana" class="tabbtn active" data-tab="rencana" aria-selected="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16M8 14h4"/></svg>
      <span>Rencana</span>
    </button>
    <button id="btn-peta" class="tabbtn" data-tab="peta" aria-selected="false">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.2"/></svg>
      <span>Peta</span>
    </button>
  </nav>
</div>
<script src="js/app.js?v=1731"></script>
</body>
</html>
